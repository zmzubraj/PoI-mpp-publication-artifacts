[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-mpp"
version = "0.1.0"
description = "Minimum Publishable Prototype for a verifiable Proof-of-Intelligence consensus architecture"
requires-python = "==3.11.*"
dependencies = [
    "pydantic==2.12.5",
    "pyarrow==25.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-q"
