[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-mpp"
version = "0.1.0"
description = "Minimum Publishable Prototype for a verifiable Proof-of-Intelligence consensus architecture"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
