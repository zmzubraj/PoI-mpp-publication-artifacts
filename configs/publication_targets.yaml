# Publication targets; not measured results.
experiments:
  E1:
    min_receipts: 1000
    models: ["primary", "optional_scale"]
  E2:
    tamper_trials: 500
    audit_rates: [0.01, 0.02, 0.05, 0.10]
  E3:
    grounded_items: 500
    confidence_interval: 0.95
  E4:
    withholding_fractions: [0.05, 0.10, 0.20, 0.30, 0.50]
    da_samples: [4, 8, 16, 32]
  E5:
    watcher_counts: [1, 2, 4, 8, 16, 32]
    fraud_values: [10, 100, 1000]
  E6:
    identities: [1, 2, 4, 8, 16, 32, 64]
    seeds: 1000
  E7:
    calls: ["registerModel", "createTask", "commitResponse", "openChallenge", "finalizeReceipt", "updateCredit"]
  E8:
    epochs: 1000
    attack_modes: ["honest", "sybil", "subsidized_compute", "collusion"]

reporting:
  confidence_level: 0.95
  ci_method: "bootstrap_or_exact_binomial_as_appropriate"
  do_not_report_unexecuted_values: true
